# ─────────────────────────────────────────────────────────────────────
# yoshi389111/github-profile-3d-contrib — isometric 3D contribution city.
# Commits SVGs into profile-3d-contrib/ on main.
# ─────────────────────────────────────────────────────────────────────
name: 3d-contrib

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/3d-contrib.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # A PAT here (instead of GITHUB_TOKEN) makes private
          # contributions show up too. See docs/03-workflows.md.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # NO SETTING_JSON.
          #
          # Supplying one switches the action into "customize" mode: it writes
          # a single profile-customize.svg, drops the 3D calendar entirely and
          # renders only a language donut — and in run #2 it came out
          # 1280x850, black, with unreadable labels, because the palette keys
          # in that settings file are not the ones customize mode expects.
          #
          # Without it the action writes its standard named variants, which are
          # properly styled and actually contain the calendar. The README uses
          # profile-night-rainbow.svg.

      - name: Show what the action actually wrote
        run: ls -la profile-3d-contrib/

      # Guard against the class of bug that bit run #2: the README referencing
      # a filename the action never produces. Cheaper to fail here than to
      # ship a broken image.
      - name: Verify the file the README expects exists
        run: |
          expected=profile-3d-contrib/profile-night-rainbow.svg
          if [ ! -s "$expected" ]; then
            echo "::error::$expected was not generated. Available:"
            ls -1 profile-3d-contrib/ || true
            exit 1
          fi

      - name: Commit generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore(3d): refresh contribution calendar"
          git push

# ─────────────────────────────────────────────────────────────────────
# lowlighter/metrics — renders every SVG panel on the profile README
# and COMMITS them into this repo. Nothing on the README depends on a
# third-party service being up at page-load time.
#
# Secrets required:  METRICS_TOKEN  (classic PAT, scopes: read:user,
#                    repo  — `repo` is what lets it count private work)
# Docs:              ../../../docs/03-workflows.md
# ─────────────────────────────────────────────────────────────────────
name: metrics

on:
  schedule:
    - cron: "17 4 * * *"      # 06:17 Europe/Amsterdam (summer) — off-peak
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:

  # ── 1. The terminal panel (the one you picked) ──────────────────────
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.terminal.svg
          template: terminal
          base: header, metadata
          config_timezone: Europe/Amsterdam
          config_output: svg

          # 960px instead of the default 480. The panel is full-width on the
          # README, and at 480 native it either upscaled to ~1.65x (text twice
          # the size of everything else) or sat native in a narrow column with
          # empty space either side. At 960 it renders at ~0.82x in a ~790px
          # column, the same scale as every other panel, and the extra width
          # goes into the line length rather than the type size.
          #
          # The docs warn `large` "may not be supported by all templates".
          # It IS supported by terminal - verified on a real run, see
          # docs/09-changelog.md. Re-check the output dimensions if you ever
          # change the template.
          config_display: large

          # No isocalendar here. In run #2 it made this panel 480x823 - which
          # the README then upscaled to full width, so it towered over
          # everything and the prompt lines fell out of frame. It is also
          # already shown full-width in its own README section, so it was
          # duplicated. Terminal is now metadata + languages + lines.

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage

          plugin_lines: yes

          # Recolour the terminal template onto the profile palette.
          #
          # The template ships a maroon body (#42092b) and a brown-grey
          # titlebar, which is the one panel on the page that looks like it
          # came from somewhere else. `extras_css` is the action's documented
          # hook for this - these selectors are the template's own, read out of
          # a published metrics.terminal.svg, not guessed.
          #
          # Verified by sampling the rendered pixels: titlebar #121E24,
          # body #0B0F14. Do not "check" this from a static screenshot of the
          # whole panel - the terminal types itself in over ~4 seconds and a
          # headless capture shows it mostly empty (see CLAUDE.md).
          extras_css: |
            svg{color:#c9d1d9}
            .header{background:linear-gradient(#16232a 0,#101a20 100%)}
            .title{color:#8aa7b0}
            .button{background:linear-gradient(#2a3b44 0,#1d2c33 100%);color:#7f9aa2;text-shadow:none}
            .button.exit{background:linear-gradient(#ff6f61 0,#e5484d 100%);color:#0b0f14}
            pre{color:#c9d1d9;background:#0b0f14}
            .banner,footer{color:#6f8b94}
            .ps1-path{color:#00e5a0}
            .ps1-location{color:#3ad6ff}

  # ── 2. Isometric commit calendar, on its own so it can be a half-width card
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.isocalendar.svg
          base: ""
          config_timezone: Europe/Amsterdam
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  # ── 3. Languages ────────────────────────────────────────────────────
  #
  # Split from habits after run #2: a single job produced ONE file, so when
  # it failed the profile lost both panels and there was no way to tell which
  # plugin was at fault. Two jobs, two files, independent failures.
  #
  # `plugin_languages_sections: recently-used` was dropped. It clones your
  # repositories inside the runner to analyse recent commits — slow, and the
  # most likely cause of run #2's failure. `most-used` reads the GraphQL API
  # and is what actually renders the bar chart.
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.languages.svg
          base: ""
          config_timezone: Europe/Amsterdam
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          plugin_languages_analysis_timeout: 15

  # ── 4. Stats summary ────────────────────────────────────────────────
  #
  # Replaces the github-readme-stats.vercel.app card, which returned
  # 503 DEPLOYMENT_PAUSED - the public instance was switched off, so the
  # README showed "error fetching data" and no amount of parameter tuning
  # would have fixed it. Same reason the top-langs card went: that data is
  # already in metrics.languages.svg above.
  #
  # This panel is committed into the repo like every other one, so it
  # cannot break because somebody else's free hosting lapsed.
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.stats.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Amsterdam
          config_output: svg

# ─────────────────────────────────────────────────────────────────────
# There is no fifth job, and the trophy slot on the README is empty on
# purpose. Two plugins were tried for it and BOTH render "Unexpected
# error" into the SVG on a green job:
#
#   plugin_achievements  GraphQL query asks for Projects (classic),
#                        which GitHub has sunset, so the API rejects it.
#   plugin_activity      TypeError at plugins/activity/index.mjs:140 —
#                        the PushEvent branch calls payload.commits.filter()
#                        with no guard, and some of his push events carry
#                        no commits array. Setting visibility to `public`
#                        does not avoid it; it is not about private repos.
#
# Both checked 2026-09-15 against metrics@latest. Do not re-add either
# expecting a parameter to help. If you want something in that slot,
# render the published SVG and LOOK at it before shipping.
# ─────────────────────────────────────────────────────────────────────

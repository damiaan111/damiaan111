# ─────────────────────────────────────────────────────────────────────
# lowlighter/metrics — renders every SVG panel on the profile README
# and COMMITS them into this repo. Nothing on the README depends on a
# third-party service being up at page-load time.
#
# Secrets required:  METRICS_TOKEN  (classic PAT, scopes: read:user,
#                    repo  — `repo` is what lets it count private work)
# Docs:              ../../../docs/03-workflows.md
# ─────────────────────────────────────────────────────────────────────
name: metrics

on:
  schedule:
    - cron: "17 4 * * *"      # 06:17 Europe/Amsterdam (summer) — off-peak
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:

  # ── 1. The terminal panel (the one you picked) ──────────────────────
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.terminal.svg
          template: terminal
          base: header, metadata
          config_timezone: Europe/Amsterdam
          config_output: svg

          # No isocalendar here. In run #2 it made this panel 480x823 - which
          # the README then upscaled to full width, so it towered over
          # everything and the prompt lines fell out of frame. It is also
          # already shown full-width in its own README section, so it was
          # duplicated. Terminal is now metadata + languages + lines.

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage

          plugin_lines: yes

  # ── 2. Isometric commit calendar, on its own so it can be a half-width card
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.isocalendar.svg
          base: ""
          config_timezone: Europe/Amsterdam
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  # ── 3. Languages ────────────────────────────────────────────────────
  #
  # Split from habits after run #2: a single job produced ONE file, so when
  # it failed the profile lost both panels and there was no way to tell which
  # plugin was at fault. Two jobs, two files, independent failures.
  #
  # `plugin_languages_sections: recently-used` was dropped. It clones your
  # repositories inside the runner to analyse recent commits — slow, and the
  # most likely cause of run #2's failure. `most-used` reads the GraphQL API
  # and is what actually renders the bar chart.
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.languages.svg
          base: ""
          config_timezone: Europe/Amsterdam
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          plugin_languages_analysis_timeout: 15

  # ── 4. PageSpeed for my own sites — measured, not claimed ───────────
  #     One job per URL: the plugin takes a single url.
  pagespeed-tacshot:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.pagespeed.tacshot.svg
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://tacshot.nl
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_screenshot: yes
          # Optional but strongly recommended — without a key the
          # Google API is aggressively rate limited and this job flakes.
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}

  pagespeed-vdbrinks:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.pagespeed.vdbrinks.svg
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://website.vdbrinks.nl
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_screenshot: yes
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}

  # ── 5. Live screenshots of my sites, taken by the Action ────────────
  #     Replaces hand-captured PNGs that go stale the day you redesign.
  screenshots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run #2 photographed Cloudflare's "Verify you are human" page on
          # both sites, not the sites. Your own bot protection challenges the
          # Action's headless Chrome like any other datacentre client.
          #
          # Fix: a Cloudflare WAF *skip* rule keyed on a secret query string,
          # then append it here. docs/08-runbook.md has the rule.
          #   url: "https://tacshot.nl/?shot=${{ secrets.SHOT_KEY }}"
          - { slug: tacshot,  url: "https://tacshot.nl",           title: "tacshot.nl" }
          - { slug: vdbrinks, url: "https://website.vdbrinks.nl",  title: "website.vdbrinks.nl" }
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.screenshot.${{ matrix.slug }}.svg
          base: ""
          plugin_screenshot: yes
          plugin_screenshot_title: ${{ matrix.title }}
          plugin_screenshot_url: ${{ matrix.url }}
          plugin_screenshot_selector: body
          plugin_screenshot_viewport: '{ "width": 1280, "height": 720 }'
          # Raised from 2500 after run #2 captured a Cloudflare interstitial.
          # The wait was not the real problem (see below) but a challenged
          # page needs longer than a served one either way.
          plugin_screenshot_wait: 6000
          plugin_screenshot_background: yes

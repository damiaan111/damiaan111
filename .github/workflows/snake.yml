# ─────────────────────────────────────────────────────────────────────
# Platane/snk — the contribution-graph snake.
# Output goes to the `output` branch so it never clutters main's history.
# The README references it via raw.githubusercontent.com/.../output/...
# ─────────────────────────────────────────────────────────────────────
name: snake

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=%2300e5a0&color_dots=%230d1117,%231b3b33,%23238f6f,%2300e5a0,%233ad6ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

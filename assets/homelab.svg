<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384" role="img"
     aria-label="Homelab topology: WAN to Omada router to VLANs to Proxmox VE to LXC + Docker. Running 11 lxc + docker / 3 virtual machines.">
  <title>The homelab &#8212; Utrecht, NL</title>
  <defs>
    <linearGradient id="hl-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5a0"/><stop offset="50%" stop-color="#3ad6ff"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/><stop offset="100%" stop-color="#101a20"/>
    </linearGradient>
    <clipPath id="hl-c"><rect width="880" height="384" rx="14"/></clipPath>
    <style>
      .m{font-family:"SFMono-Regular",Consolas,Menlo,monospace}
      .lbl{font-size:11.5px;font-weight:600;fill:#dbe9e6}
      .sub{font-size:9.5px;fill:#6f8b94}
      .chip{font-size:10.5px;fill:#b9d2cd}
      /* No entrance animations: every element is fully opaque at frame 0, so
         a static capture looks the same as the live file. Only the packet dot
         and the status pip move. */
      .pkt{animation:hl-run 3.6s linear infinite}
      @keyframes hl-run{0%{transform:translateX(0)}100%{transform:translateX(536px)}}
      .pip{animation:hl-bl 1.6s steps(1) infinite}
      @keyframes hl-bl{0%,55%{opacity:1}56%,100%{opacity:.2}}
    </style>
  </defs>

  <g clip-path="url(#hl-c)">
    <rect width="880" height="384" fill="url(#hl-bg)"/>
    <rect x="0" y="0" width="880" height="3" fill="url(#hl-a)"/>

    <circle cx="26" cy="30" r="5" fill="#ff5f56"/>
    <circle cx="44" cy="30" r="5" fill="#ffbd2e"/>
    <circle cx="62" cy="30" r="5" fill="#27c93f"/>
    <text class="m" x="84" y="34" font-size="12.5" fill="#7f9aa2">damiaan@homelab:~$ <tspan fill="#00e5a0">topology --live</tspan></text>
    <g>
      <circle class="pip" cx="790" cy="30" r="4" fill="#00e5a0"/>
      <text class="m sub" x="802" y="34">all up</text>
    </g>
    <line x1="0" y1="52" x2="880" y2="52" stroke="#1b2a31"/>

    <line x1="172.0" y1="104.0" x2="708.0" y2="104.0" stroke="#24424a" stroke-width="2"/>
    <circle class="pkt" cx="172.0" cy="104.0" r="3.5" fill="#3ad6ff"/>
    <g>
      <rect x="28.0" y="76" width="144.0" height="56" rx="9" fill="#0d151b" stroke="#24424a"/>
      <text class="m lbl" x="100.0" y="100" text-anchor="middle">WAN</text>
      <text class="m sub" x="100.0" y="116" text-anchor="middle">the connection in</text>
    </g>
    <g>
      <rect x="198.0" y="76" width="144.0" height="56" rx="9" fill="#0d151b" stroke="#2c5a52"/>
      <text class="m lbl" x="270.0" y="100" text-anchor="middle">Omada router</text>
      <text class="m sub" x="270.0" y="116" text-anchor="middle">gateway</text>
    </g>
    <g>
      <rect x="368.0" y="76" width="144.0" height="56" rx="9" fill="#0d151b" stroke="#24424a"/>
      <text class="m lbl" x="440.0" y="100" text-anchor="middle">VLANs</text>
      <text class="m sub" x="440.0" y="116" text-anchor="middle">segmented network</text>
    </g>
    <g>
      <rect x="538.0" y="76" width="144.0" height="56" rx="9" fill="#0d151b" stroke="#5a4a2c"/>
      <text class="m lbl" x="610.0" y="100" text-anchor="middle">Proxmox VE</text>
      <text class="m sub" x="610.0" y="116" text-anchor="middle">bare metal, mine</text>
    </g>
    <g>
      <rect x="708.0" y="76" width="144.0" height="56" rx="9" fill="#0d151b" stroke="#2c4a5a"/>
      <text class="m lbl" x="780.0" y="100" text-anchor="middle">LXC + Docker</text>
      <text class="m sub" x="780.0" y="116" text-anchor="middle">containers and VMs</text>
    </g>
    <text class="m sub" x="28" y="162" fill="#4f6d78">LXC + DOCKER</text>
    <line x1="106.8" y1="158" x2="852" y2="158" stroke="#1b2a31"/>
    <g>
      <rect x="28.0" y="176" width="94.4" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="46.0" cy="193.0" r="4" fill="#e57000"/>
      <text class="m chip" x="58.0" y="197.0">Proxdash</text>
    </g>
    <g>
      <rect x="132.4" y="176" width="81.8" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="150.4" cy="193.0" r="4" fill="#e58325"/>
      <text class="m chip" x="162.4" y="197.0">Mealie</text>
    </g>
    <g>
      <rect x="224.2" y="176" width="94.4" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="242.2" cy="193.0" r="4" fill="#00ae42"/>
      <text class="m chip" x="254.2" y="197.0">Bambuddy</text>
    </g>
    <g>
      <rect x="328.6" y="176" width="69.2" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="346.6" cy="193.0" r="4" fill="#e5a00d"/>
      <text class="m chip" x="358.6" y="197.0">Plex</text>
    </g>
    <g>
      <rect x="407.8" y="176" width="81.8" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="425.8" cy="193.0" r="4" fill="#4250af"/>
      <text class="m chip" x="437.8" y="197.0">Immich</text>
    </g>
    <g>
      <rect x="499.6" y="176" width="132.2" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="517.6" cy="193.0" r="4" fill="#68bc71"/>
      <text class="m chip" x="529.6" y="197.0">AdGuard Home 1</text>
    </g>
    <g>
      <rect x="641.8" y="176" width="132.2" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="659.8" cy="193.0" r="4" fill="#68bc71"/>
      <text class="m chip" x="671.8" y="197.0">AdGuard Home 2</text>
    </g>
    <g>
      <rect x="28.0" y="220" width="113.3" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="46.0" cy="237.0" r="4" fill="#f38020"/>
      <text class="m chip" x="58.0" y="241.0">Cloudflared</text>
    </g>
    <g>
      <rect x="151.3" y="220" width="144.8" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="169.3" cy="237.0" r="4" fill="#00a9ce"/>
      <text class="m chip" x="181.3" y="241.0">Omada Controller</text>
    </g>
    <g>
      <rect x="306.1" y="220" width="163.7" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="324.1" cy="237.0" r="4" fill="#88171a"/>
      <text class="m chip" x="336.1" y="241.0">WireGuard Dashboard</text>
    </g>
    <g>
      <rect x="479.8" y="220" width="113.3" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="497.8" cy="237.0" r="4" fill="#175ddc"/>
      <text class="m chip" x="509.8" y="241.0">Vaultwarden</text>
    </g>
    <text class="m sub" x="28" y="276" fill="#4f6d78">VIRTUAL MACHINES</text>
    <line x1="128.4" y1="272" x2="852" y2="272" stroke="#1b2a31"/>
    <g>
      <rect x="28.0" y="290" width="132.2" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="46.0" cy="307.0" r="4" fill="#41bdf5"/>
      <text class="m chip" x="58.0" y="311.0">Home Assistant</text>
    </g>
    <g>
      <rect x="170.2" y="290" width="151.1" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="188.2" cy="307.0" r="4" fill="#10559a"/>
      <text class="m chip" x="200.2" y="311.0">Pterodactyl Panel</text>
    </g>
    <g>
      <rect x="331.3" y="290" width="151.1" height="34" rx="8" fill="#101c22" stroke="#24424a"/>
      <circle cx="349.3" cy="307.0" r="4" fill="#10559a"/>
      <text class="m chip" x="361.3" y="311.0">Pterodactyl Wings</text>
    </g>
    <line x1="0" y1="344" x2="880" y2="344" stroke="#1b2a31"/>
    <text class="m" x="28" y="366" font-size="11" fill="#7f9aa2">No cloud subscription. No trackers. Hardware I own, in Utrecht.</text>
    <text class="m" x="852" y="366" font-size="11" fill="#00e5a0" text-anchor="end">vdbrinks.nl</text>
    <rect x=".5" y=".5" width="879" height="383" rx="14" fill="none" stroke="#24424a"/>
  </g>
</svg>

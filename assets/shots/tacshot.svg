<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="TACSHOT">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/><stop offset="100%" stop-color="#121c22"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5a0"/><stop offset="100%" stop-color="#3ad6ff"/>
    </linearGradient>
    <pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b2a31" stroke-width="1"/>
    </pattern>
    <clipPath id="c"><rect width="640" height="300" rx="14"/></clipPath>
    <style>
      .m{font-family:"SFMono-Regular",Consolas,Menlo,monospace}
      .t{font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:2px}
      .sw{animation:sw 4.4s linear infinite}
      @keyframes sw{0%{transform:translateX(-200px)}100%{transform:translateX(640px)}}
      .dot{animation:bl 1.4s steps(1) infinite}
      @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:.15}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="640" height="300" fill="url(#g)"/>
    <rect width="640" height="300" fill="url(#p)" opacity=".7"/>
    <rect class="sw" x="0" y="0" width="200" height="300" fill="#00e5a0" opacity=".05"/>
    <text class="t" x="34" y="150" font-size="34" fill="#e9f3f1">TACSHOT</text>
    <rect x="36" y="166" width="150" height="3" rx="1.5" fill="url(#a)"/>
    <text class="m" x="36" y="196" font-size="13.5" fill="#8fb3ad">top-down tactical battle royale</text>
    <g>
      <circle class="dot" cx="42" cy="252" r="4" fill="#00e5a0"/>
      <text class="m" x="56" y="257" font-size="12" fill="#5d7a86">tacshot.nl</text>
    </g>
    <text class="m" x="606" y="257" font-size="11.5" fill="#00e5a0" text-anchor="end" opacity=".75">20 players · one life</text>
    <rect x="0" y="0" width="640" height="3" fill="url(#a)"/>
    <rect x=".5" y=".5" width="639" height="299" rx="14" fill="none" stroke="#1f3a42"/>
  </g>
</svg>
